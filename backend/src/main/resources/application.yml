spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:.env.local[.properties]
      - optional:file:../.env.local[.properties]
  application:
    name: fundflow-backend
  datasource:
    url: ${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/fundflow}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

app:
  jwt:
    secret: ${JWT_SECRET:zcH2rDy+Eu6/aTNlwvqF3WXc2AoAedlWVt2D3MKUiU0=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
    allowed-origins: ${FRONTEND_ORIGINS:}

server:
  port: ${SERVER_PORT:8080}
